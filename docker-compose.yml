services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: base_backend
    ports:
      # Host 5433 → evita colisão com um Postgres nativo já rodando em 5432.
      - "5433:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d base_backend"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dados:
